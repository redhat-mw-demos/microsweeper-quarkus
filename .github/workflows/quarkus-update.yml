name: Quarkus Update

on:
  schedule:
    # Run every Monday at 10:00 UTC
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch for update'
        required: true
        type: choice
        options:
          - rosa
          - aro
          - aks
          - jdconf-24
          - all

jobs:
  update-quarkus:
    name: Update Quarkus on ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: 
          - rosa
          - aro
          - aks
          - jdconf-24
    
    steps:
      - name: Checkout ${{ matrix.branch }} branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Get current Quarkus version
        id: current-version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=quarkus.platform.version -q -DforceStdout)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current Quarkus version: $CURRENT_VERSION"
      
      - name: Check for Quarkus updates
        id: check-update
        run: |
          # Get latest Quarkus version from Maven Central
          LATEST_VERSION=$(curl -s "https://search.maven.org/solrsearch/select?q=g:io.quarkus.platform+AND+a:quarkus-bom&rows=1&wt=json" | jq -r '.response.docs[0].latestVersion')
          echo "latest=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "Latest Quarkus version: $LATEST_VERSION"
          
          if [ "${{ steps.current-version.outputs.version }}" != "$LATEST_VERSION" ]; then
            echo "update_available=true" >> $GITHUB_OUTPUT
            echo "Update available: ${{ steps.current-version.outputs.version }} -> $LATEST_VERSION"
          else
            echo "update_available=false" >> $GITHUB_OUTPUT
            echo "Already on latest version"
          fi
      
      - name: Update Quarkus version
        if: steps.check-update.outputs.update_available == 'true'
        run: |
          mvn versions:set-property -Dproperty=quarkus.platform.version -DnewVersion=${{ steps.check-update.outputs.latest }}
          mvn versions:commit
      
      - name: Run tests
        if: steps.check-update.outputs.update_available == 'true'
        run: mvn clean verify -DskipITs=false
        continue-on-error: true
      
      - name: Create Pull Request
        if: steps.check-update.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            [${{ matrix.branch }}] Update Quarkus to ${{ steps.check-update.outputs.latest }}
            
            - Updated from ${{ steps.current-version.outputs.version }} to ${{ steps.check-update.outputs.latest }}
            - Automated update via GitHub Actions
          branch: quarkus-update-${{ matrix.branch }}-${{ steps.check-update.outputs.latest }}
          base: ${{ matrix.branch }}
          title: '[${{ matrix.branch }}] Update Quarkus to ${{ steps.check-update.outputs.latest }}'
          body: |
            ## Quarkus Update for `${{ matrix.branch }}` branch
            
            This PR updates Quarkus from version **${{ steps.current-version.outputs.version }}** to **${{ steps.check-update.outputs.latest }}**.
            
            ### Changes
            - Updated `quarkus.platform.version` in `pom.xml`
            
            ### Testing
            - Automated tests have been run as part of this workflow
            - Please review and test manually before merging
            
            ### Release Notes
            Check the [Quarkus release notes](https://github.com/quarkusio/quarkus/releases/tag/${{ steps.check-update.outputs.latest }}) for details.
            
            ---
            *This PR was automatically generated by the Quarkus Update workflow*
          labels: |
            dependencies
            quarkus-update
            ${{ matrix.branch }}
            automated
          draft: false

  notify-completion:
    name: Notify Update Completion
    runs-on: ubuntu-latest
    needs: update-quarkus
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Quarkus Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Update workflow completed for all branches:" >> $GITHUB_STEP_SUMMARY
          echo "- rosa" >> $GITHUB_STEP_SUMMARY
          echo "- aro" >> $GITHUB_STEP_SUMMARY
          echo "- aks" >> $GITHUB_STEP_SUMMARY
          echo "- jdconf-24" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the pull requests tab for any created update PRs." >> $GITHUB_STEP_SUMMARY

