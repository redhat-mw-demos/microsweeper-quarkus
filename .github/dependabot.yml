version: 2
updates:
  # Monitor main branch for Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    target-branch: "main"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "[main]"
      include: "scope"
    groups:
      quarkus:
        patterns:
          - "io.quarkus*"
          - "io.quarkiverse*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
        update-types:
          - "major"
          - "minor"
          - "patch"

