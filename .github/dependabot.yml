# Dependabot configuration for Quarkus updates across multiple branches
version: 2
updates:
  # Monitor ROSA branch for Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "ROSA"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "quarkus-update"
      - "ROSA"
    commit-message:
      prefix: "[ROSA]"
      include: "scope"
    groups:
      quarkus:
        patterns:
          - "io.quarkus*"
          - "io.quarkiverse*"
        update-types:
          - "minor"
          - "patch"

  # Monitor ARO branch for Maven dependencies
