# Dependabot configuration for Quarkus updates across multiple branches
version: 2
updates:
  # Monitor rosa branch for Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "rosa"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "quarkus-update"
      - "rosa"
    commit-message:
      prefix: "[rosa]"
      include: "scope"
    groups:
      quarkus:
        patterns:
          - "io.quarkus*"
          - "io.quarkiverse*"
        update-types:
          - "minor"
          - "patch"

  # Monitor aro branch for Maven dependencies
